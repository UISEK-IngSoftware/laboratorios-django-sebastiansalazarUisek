{% extends "base.html" %}

{% block title %}
Formulario Entrenador
{% endblock title %}

{% block content %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_div }}

    <button type="submit" class="btn btn-primary">
        Guardar Entrenador
    </button>

    <a href="{% url 'pokedex:index' %}" class="btn btn-secondary">
        Regresar
    </a>

</form>

{% endblock content %}
